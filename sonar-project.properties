# SonarQube Cloud analysis: run by the CI `sonar` job on each push to main; locally,
# `cargo sonar-scanner`, with the token in the SONAR_TOKEN
# environment variable (never in this file).
sonar.organization=loris01100
sonar.projectKey=Loris01100_Lanista
# Build output and the Python virtual environment are not project code.
sonar.exclusions=target/**,python/.venv/**
# The window and asset loading of `main.rs` only run with a screen.
sonar.coverage.exclusions=crates/lanista/src/main.rs
# Test coverage, generated before the scan: `cargo llvm-cov --workspace --lcov --output-path lcov.info`.
sonar.rust.lcov.reportPaths=lcov.info
