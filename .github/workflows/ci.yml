name: CI

on:
  push:
    branches: [main]
    tags: ["phase-*"]
  pull_request:

permissions:
  contents: read

jobs:
  # Platform-independent checks: run once.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: cargo-machete,cargo-deny
      # Dependencies declared in a Cargo.toml but never used.
      - run: cargo machete
      # Vulnerabilities, licenses and sources of dependencies (deny.toml).
      - run: cargo deny check

  # Windows and Linux: the same seed must replay the same combat on both.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
