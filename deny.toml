# cargo deny check: known vulnerabilities, licenses, duplicate crates and sources.
# Runs in CI.

[graph]
# Shipped targets: Windows and Linux (Steam Deck).
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

[advisories]
# A false positive goes here with its id and why it does not apply.
ignore = [
    # macroquad: soundness issues with no fixed version. macroquad is the roadmap's
    # chosen engine base; revisit if a fixed release ships.
    { id = "RUSTSEC-2025-0035", reason = "no fixed macroquad release; engine choice from the roadmap" },
    # ttf-parser (fonts in macroquad and egui) is unmaintained; no replacement upstream yet.
    { id = "RUSTSEC-2026-0192", reason = "transitive via macroquad and egui; no alternative yet" },
]

[licenses]
# Permissive licenses compatible with distributing the game on Steam.
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
# target-lexicon: build dependency of pyo3 only. The LLVM exception adds permissions to Apache-2.0.
exceptions = [
    { crate = "target-lexicon", allow = ["Apache-2.0 WITH LLVM-exception"] },
    # egui's default fonts (Hack, Noto, Ubuntu): both licenses allow bundling in a commercial game.
    { crate = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
]

[licenses.private]
# The workspace crates are unpublished (publish = false) and carry no license yet.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between workspace crates have no version: not a wildcard.
allow-wildcard-paths = true

# Crate dependency rules from the roadmap. `wrappers` lists the only crates allowed
# to depend on the banned crate directly; any other direct dependent fails the check.
# lanista_ia_onnx (ONNX inference), lanista_py (PyO3); outils (CLI) is planned.
deny = [
    # Rendering stays out of the logic, the AI, the Python module and the tools.
    { crate = "macroquad", wrappers = ["reesch", "lanista", "egui-macroquad"] },
    { crate = "egui", wrappers = ["reesch", "lanista", "egui-macroquad", "egui-miniquad"] },
    # ML runtime only in the inference crate (and the game, which ships it).
    { crate = "tract-onnx", wrappers = ["lanista_ia_onnx", "lanista"] },
    { crate = "pyo3", wrappers = ["lanista_py"] },
    # The engine stays generic: it never sees the game logic.
    { crate = "lanista_core", wrappers = ["lanista", "lanista_ia_onnx", "lanista_py", "outils"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
