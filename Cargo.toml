[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
# Highest `rust-version` among the dependencies (tract).
rust-version = "1.91"
authors = ["Loris01100"]
repository = "https://github.com/Loris01100/Lanista"
license-file = "LICENSE"
publish = false

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2

# Every crate opts in with `[lints] workspace = true`.
# Pedantic lints warn, so CI (-D warnings) rejects them: fix the lint, or use a local
# #[expect(clippy::…, reason = "…")].
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Leftovers from work in progress.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
