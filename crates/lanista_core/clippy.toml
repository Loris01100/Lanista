# Clippy settings for lanista_core only: clippy reads the clippy.toml of the crate
# being checked first, so these rules don't reach the engine or the executable.
# A clippy.toml at the workspace root would be ignored for this crate.

# Longest function allowed, in lines (clippy's default, stated here on purpose).
too-many-lines-threshold = 100

# Logic is headless and silent: what it has to tell goes in its results or logs.
disallowed-macros = [
    { path = "std::println", reason = "logic doesn't print: return it to the caller" },
    { path = "std::print", reason = "logic doesn't print: return it to the caller" },
    { path = "std::eprintln", reason = "logic doesn't print: return it to the caller" },
    { path = "std::eprint", reason = "logic doesn't print: return it to the caller" },
]

# Determinism: the same seed must replay the same combat on Windows and Linux.
disallowed-types = [
    { path = "std::collections::HashMap", reason = "random iteration order: use BTreeMap or a sorted Vec" },
    { path = "std::collections::HashSet", reason = "random iteration order: use BTreeSet or a sorted Vec" },
]
disallowed-methods = [
    { path = "std::time::Instant::now", reason = "logic only knows ticks" },
    { path = "std::time::SystemTime::now", reason = "logic only knows ticks" },
    { path = "f32::sin", reason = "may differ between platforms: use libm" },
