[package]
name = "lanista_core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
libm = "0.2.16"
rand = { version = "0.10.3", default-features = false }
rand_chacha = { version = "0.10.0", features = ["serde"] }
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[lints]
workspace = true

[dev-dependencies]
criterion = "0.8.2"
insta = "1.49.0"
proptest = "1.12.0"

[[bench]]
name = "melee"
harness = false

# No doctests: rustdoc would only compile an empty run.
[lib]
doctest = false
