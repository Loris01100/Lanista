[package]
name = "tools"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
lanista_core = { version = "0.1.0", path = "../lanista_core" }
rand = { version = "0.10.3", default-features = false }
rand_chacha = "0.10.0"
rayon = "1.12.0"

[lints]
workspace = true

# No doctests: rustdoc would only compile an empty run.
[lib]
doctest = false

# The binaries have no unit tests; tests/ runs them through CARGO_BIN_EXE_*.

[[bin]]
name = "batch"
test = false

[[bin]]
name = "calibrate"
test = false

[[bin]]
name = "career"
test = false

[[bin]]
name = "compare"
test = false

[[bin]]
name = "simulate"
test = false
