[package]
name = "lanista_py"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
lanista_core = { version = "0.1.0", path = "../lanista_core" }
pyo3 = { version = "0.29.3", features = ["abi3-py312"] }

[lints]
workspace = true

# Python extension module, built with `maturin develop` (see pyproject.toml).
# No Rust tests: a test binary would have to link libpython.
[lib]
crate-type = ["cdylib"]
test = false
doctest = false
